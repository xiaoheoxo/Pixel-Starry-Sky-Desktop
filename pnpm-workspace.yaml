packages:
  - apps/*
  - packages/*

allowBuilds:
  electron: true
  esbuild: true
  node-pty: true
  # electron-builder 的可选依赖，只用于 Squirrel 安装包，我们不用
  electron-winstaller: false
  # SSH uses the pure JavaScript implementation; optional native accelerators are not required.
  cpu-features: false
  ssh2: false
  '@google/genai': false
  protobufjs: false

patchedDependencies:
  # 补丁的每一处改动都有金丝雀测试：packages/cli/test/pi-patch.test.ts（重做补丁漏了哪一块、或某块不再起作用，对应那条会变红）
  '@earendil-works/pi-coding-agent@1.2.0': patches/@earendil-works__pi-coding-agent@1.2.0.patch
