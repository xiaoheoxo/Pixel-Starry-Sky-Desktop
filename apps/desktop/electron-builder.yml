# 打包配置（electron-builder）。用法：仓库根目录执行 pnpm dist（Windows），产物在 apps/desktop/release/。
# macOS（dmg + zip，Intel 和 Apple 芯片）只能在 Mac 上打，Linux（AppImage + deb）在 Linux 上打：CI 里各用一台机器（.github/workflows/release.yml）
appId: com.pixelsky.desktop
productName: 像素星空
# 下载 Electron 运行时用国内镜像（electron-builder 也认 ELECTRON_MIRROR 环境变量，可覆盖）
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
directories:
  output: release
  buildResources: build
# 界面依赖已由 Vite 打进 out/，安装包里只需要构建产物
files:
  - out/**
  - package.json
asar: true
# node-pty 的原生模块和 macOS 的 spawn-helper 要放在 asar 外面才能加载、执行
asarUnpack:
  - '**/node_modules/node-pty/**'
# macOS 的 spawn-helper 要有执行权限（build/after-pack.cjs）
afterPack: build/after-pack.cjs
# 托盘图标（docs/ui/tray.md §2.5）：运行时从 resources/tray 读，不进 asar
extraResources:
  - from: build/tray
    to: tray
  # 随包的扩展（Material 图标等），主进程从 resources/builtin-extensions 读；目录由 WP3 建，没有它时加载器什么都不读
  - from: resources/builtin-extensions
    to: builtin-extensions
  # 像素星空命令行（packages/cli/scripts/bundle.mjs 生成）：Electron 自带 node 直接跑磁盘上的文件，wasm / worker 按路径读，不能进 asar
  - from: ../../packages/cli/dist/pixel-cli
    to: pixel-cli
    filter: ['**/*']
# node-pty 用自带的 N-API 预编译文件（win32-x64、darwin-x64 / arm64），N-API 不分 Electron 版本，不用重编译；
# 本机构建工具未安装 Spectre 缓解库，强制重编译会失败。Electron 44 已通过实际 PTY 输入 / resize / 退出验证。
# Linux 没有预编译文件：pnpm install 时按 Node 编译出 build/Release/pty.node（N-API，Electron 一样能用）
npmRebuild: false
win:
  # 只出安装版（能自动更新）。便携版 0.2.5-beta 起不再提供：还在用旧便携版的，有新版时提示去下载安装版。docs/release-update.md §7
  target:
    - target: nsis
      arch: x64
  # 暂不签名（首次运行 SmartScreen 会提示“未知发布者”），但仍写入产品名、版本等文件信息
  signExecutable: false
  icon: build/icon.ico
nsis:
  # 安装向导（docs/release-update.md §9）：先选「仅为我 / 所有用户」（默认仅为我，不要管理员），再选安装位置，装完勾选运行
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ${productName}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # 跟系统语言：中文系统显示中文，其余显示英文
  installerLanguages: [zh_CN, en_US]
  # build/installer.nsh：安装文件夹名改成 PixelSky；选完位置后补 \PixelSky 子文件夹（卸载删不到别的文件）、检查写权限
  include: build/installer.nsh
  artifactName: PixelSky-${version}-setup.exe
  uninstallDisplayName: ${productName}
mac:
  # 文件名不能有中文：GitHub 会改掉 Release 里的中文文件名，latest-mac.yml 里的地址就对不上了
  artifactName: PixelSky-${version}-mac-${arch}.${ext}
  # dmg 给人下载安装；zip 是 electron-updater 在 macOS 上用的格式
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  # macOS 的图标四周要留白（1024 画布里方块占 824），和系统里别的图标一样大；scripts/make-brand-icons.mjs 生成
  icon: build/icon-mac.png
  # 暂不签名、不公证：只做 ad-hoc 签名（Apple 芯片上不签名根本打不开）。
  # 第一次打开系统会拦，要在「系统设置 › 隐私与安全性」里点「仍要打开」；也不能自动更新（只提示去下载）
  identity: '-'
  hardenedRuntime: false
  # 不带 Windows 的东西
  files:
    - '!**/node_modules/node-pty/prebuilds/win32-*/**'
dmg:
  artifactName: PixelSky-${version}-mac-${arch}.${ext}
  title: ${productName} ${version}
linux:
  artifactName: PixelSky-${version}-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  # 命令名、.desktop 文件名用英文
  executableName: pixelsky
  category: Development
  icon: build/icon.png
  synopsis: Claude Code / Codex 桌面工作台
  maintainer: xiaoheoxo <xiaoheoxo@users.noreply.github.com>
  vendor: xiaoheoxo
  desktop:
    entry:
      Name: 像素星空
      GenericName: AI Coding Workbench
      StartupWMClass: 像素星空
  files:
    - '!**/node_modules/node-pty/prebuilds/**'
  # 窗口图标（Linux 不从程序文件里取）
  extraResources:
    - from: build/icon.png
      to: icon.png
    # Linux 的 extraResources 会覆盖顶层的，命令行要再写一遍
    - from: ../../packages/cli/dist/pixel-cli
      to: pixel-cli
      filter: ['**/*']
deb:
  packageName: pixelsky
  # 用到的系统库（Electron 的常规依赖，Ubuntu / Debian 桌面版都有）
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
# 更新源：GitHub Releases（CI 推 v* 标签时上传；本机 pnpm dist 不上传）
publish:
  provider: github
  owner: xiaoheoxo
  repo: Pixel-Starry-Sky-Desktop
  releaseType: draft
# 测试版也只生成 latest.yml：electron-updater 在测试版 Release 里找不到 beta.yml 时会回落到 latest.yml
