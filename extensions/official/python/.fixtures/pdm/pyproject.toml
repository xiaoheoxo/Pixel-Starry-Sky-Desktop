[project]
name = "pdm-demo"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pdm]
distribution = true

[tool.pdm.scripts]
# 运行测试
test = "pytest -q"
lint = {cmd = "ruff check .", help = "代码检查"}
start = {call = "pdm_demo.app:main"}
post_install = "pdm run lint"
fmt.cmd = "ruff format ."
fmt.help = "格式化"

[tool.pdm.dev-dependencies]
dev = ["pytest"]

[tool.pdm.scripts.serve]
cmd = "uvicorn app:app"
